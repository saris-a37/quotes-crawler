# This is a basic workflow to help you get started with Actions

name: ThaiBMA Bond Price MTM Runner

# Controls when the workflow will run
on:
  # Automatically run workflow with cron schedule
  #schedule:
    #- cron: '5/15 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  ThaiBMA_Bond_Price_MTM:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./ThaiBMA

    # Grant write content permission to the job
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      # Set-up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      # Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python3 -m pip install pandas
          python3 -m pip install pdfplumber --break-system-packages

      # Make scripts executable, then run
      - name: Execute
        run: |
          chmod +x ./ThaiBMA_Bond_Price_MTM_PDF_table_to_JSON.py
          chmod +x ./ThaiBMA_Bond_Price_MTM_crawler.sh
          ./GPF_crawler.sh

      # Commit changes to master @ remote
      - name: Commit
        id: ThaiBMA-Bond-Price-MTM-commit
        run: |
          git config --global user.name '${{ secrets.USER_NAME }}'
          git config --global user.email '${{ secrets.USER_EMAIL }}'
          git add .
          git commit -am "ThaiBMA Bond Price MTM Runner Scripts Runner (automated)"
          git push

      # Notify if there was a commit to ThaiBMA Bond Price MTM
      - name: Notify
        if: steps.ThaiBMA-Bond-Price-MTM-commit.outcome == 'success'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL }}
          password: ${{ secrets.GMAIL_APP_PASS }}
          subject: New automatic commit to quotes-crawler/ThaiBMA
          body: New automatic commit to quotes-crawler/ThaiBMA (https://github.com/saris-a37/quotes-crawler/tree/main/ThaiBMA) by ThaiBMA_Bond_Price_MTM_runner.yml
          to: ${{ secrets.USER_EMAIL }}
          from: saris-a37/quotes-crawler
